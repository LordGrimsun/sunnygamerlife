    <!-- Boot splash: painted by the HTML shell itself, before any JS bundle
         parses. Auto-removed (script at end of <body>) the moment the menu or
         the 3D scene mounts. Fully self-contained — no app module touches it. -->
    <style>
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; gap: 20px;
        align-items: center; justify-content: center;
        background: #0b0c1e; /* == the app base bg, so there is no colour flash */
        opacity: 1; transition: opacity 0.4s ease;

      #boot-splash.is-hiding { opacity: 0; pointer-events: none; }
      #boot-splash .bs-logo {
        width: min(58vw, 300px); height: auto;
        filter: drop-shadow(0 12px 26px rgba(0, 30, 70, 0.55));
        animation: bs-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      #boot-splash .bs-ring {
        width: 52px; height: 52px; border-radius: 50%;
        border: 4px solid rgba(255, 255, 255, 0.12);
        border-top-color: #0abeff; /* brand accent */
        animation: bs-spin 0.9s linear infinite;
      }
      @keyframes bs-spin { to { transform: rotate(360deg); } }
      @keyframes bs-pop { from { opacity: 0; transform: scale(0.86); } to { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .bs-logo { animation: none; }
        #boot-splash .bs-ring { animation: none; border-color: rgba(255, 255, 255, 0.12); border-top-color: #0abeff; }
      }
    </style>

  <body>
    <div id="boot-splash" role="status" aria-label="Loading Sunny Games">
      <img
        class="bs-logo"
        src="/logo.svg"
        alt=""
        decoding="async"
        onerror="this.onerror=null;this.src='/logo.png';"
      />
      <div class="bs-ring"></div>
    </div>
    <div id="app">
      <div id="scene-root"></div>
      <div id="ui-root"></div>
    </div>
    <script>
      /* Remove the boot splash once the app's first UI — the menu (#ui-root
         gains children) OR the 3D scene (#scene-root gains a <canvas>) — has
         mounted. Self-contained; never blocks the module script above, and a
         safety timeout guarantees the splash can never trap the user. */
      (function () {
        var splash = document.getElementById('boot-splash');
        if (!splash) return;
        var done = false;
        function hide() {
          if (done) return;
          done = true;
          splash.classList.add('is-hiding');
          setTimeout(function () {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          }, 500);
        }
        function ready() {
          var ui = document.getElementById('ui-root');
          var sr = document.getElementById('scene-root');
          return (ui && ui.childElementCount > 0) || (sr && sr.querySelector('canvas'));
        }
        // Prefer painting one frame first, but fall back to a short timer so
        // removal is never stuck if rAF is throttled (background/headless tab).
        function settle() {
          var fired = false;
          function go() { if (fired) return; fired = true; hide(); }
          requestAnimationFrame(function () { requestAnimationFrame(go); });
          setTimeout(go, 120);
        }
        if (ready()) { settle(); return; }
        var root = document.getElementById('app') || document.body;
        if ('MutationObserver' in window) {
          var mo = new MutationObserver(function () {
            if (ready()) { mo.disconnect(); settle(); }
          });
          mo.observe(root, { childList: true, subtree: true });
        }
        setTimeout(hide, 8000); /* safety net: never trap the user */
      })();
    </script>
    <script>
      /* WebMCP (emerging in-page agent protocol): when the browser exposes
         navigator.modelContext, register a tool so an agent can start a match
         right here. Guarded → a pure no-op in today's browsers; depends on the
         window.SunnyGames shim set in src/main.ts. Self-contained, best-effort,
         and can never break the page. */
      (function () {
        if (!('modelContext' in navigator)) return;
        try {
          navigator.modelContext.provideContext({
            tools: [
              {
                name: 'start_solo_match',
                description:
                  'Start a new single-player Sunny Games match in the current page against an opponent. Free, no login required.',
                inputSchema: {
                  type: 'object',
                  properties: {
                    ruleset: {
                      type: 'string',
                      enum: ['classic', 'mutators'],
                      description: 'Match ruleset. Default classic.',
                    },
                  },
                },
                async execute(args) {
                  var sc = window.SunnyGames;
                  var ruleset = args && args.ruleset === 'mutators' ? 'mutators' : 'classic';
                  if (sc && typeof sc.startSolo === 'function') {
                    await sc.startSolo({ ruleset: ruleset });
                    return { content: [{ type: 'text', text: 'Started a ' + ruleset + ' solo match.' }] };
                  }
                  return { content: [{ type: 'text', text: 'Game is still loading; try again shortly.' }] };
                },
              },
            ],
          });
        } catch (e) {
          /* WebMCP is best-effort; never break the page */
        }
      })();
    </script>
